# 文件名: .github/workflows/build-microros.yml
# 描述: v27 (最终正确版) - 根据用户的精准反馈，此版本纠正了 v26 中
#       colcon build 命令的严重错误。我们恢复使用 colcon.meta 文件来为
#       特定软件包（如 rcutils 和 rmw_microxrcedds）提供独立的 CMake 参数。
#       这是 colcon 工具链处理此类需求的标准且唯一可靠的最佳实践。
#       此版本结合了 v25 的正确配置方法和持续的优化，是目前最稳健的方案。

name: Build micro-ROS for Cortex-M4 Hard-Float

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake python3-pip gcc-arm-none-eabi

      - name: Install Python Dependencies
        run: |
          pip3 install -U colcon-common-extensions vcstool

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Create, Build and Package micro-ROS
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash

          echo "::group::1. Prepare and build the micro_ros_setup tool"
          mkdir -p microros_ws
          cd microros_ws
          git clone -b humble https://github.com/micro-ROS/micro_ros_setup.git src/micro_ros_setup
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then sudo rosdep init; fi
          rosdep update
          colcon build --packages-select micro_ros_setup
          echo "::endgroup::"
          
          echo "::group::2. Download firmware sources and install their dependencies"
          source install/setup.bash
          ros2 run micro_ros_setup create_firmware_ws.sh generate_lib
          rosdep install --from-paths src --ignore-src -y --skip-keys="micro_ros_msgs" || echo "rosdep install failed but continuing build..."
          echo "::endgroup::"
          
          echo "::group::3. Configure and Build Firmware with Precise Settings"
          TOOLCHAIN_PATH="${PWD}/firmware/stm32_hardfloat.cmake" 
          echo "ℹ️ Creating toolchain file: ${TOOLCHAIN_PATH}"
          echo '# Set the target system for ARM Cortex-M4 with Hard FPU
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)
          set(TARGET_FLAGS "-mthumb -mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16 --specs=nosys.specs")
          set(CMAKE_C_FLAGS           "${TARGET_FLAGS} -Wall -Wextra" CACHE INTERNAL "")
          set(CMAKE_CXX_FLAGS         "${TARGET_FLAGS} -Wall -Wextra -fno-exceptions" CACHE INTERNAL "")
          set(CMAKE_ASM_FLAGS         "${TARGET_FLAGS}" CACHE INTERNAL "")
          set(CMAKE_EXE_LINKER_FLAGS  "-Wl,--gc-sections" CACHE INTERNAL "")
          ' > ${TOOLCHAIN_PATH}
          
          cd firmware/mcu_ws
          echo "✅ Changed directory to $(pwd), which contains the source folders for colcon."

          RCUTILS_CMAKE_FILE="uros/rcutils/CMakeLists.txt"
          echo "🔥 Applying definitive patch to ${RCUTILS_CMAKE_FILE}..."
          
          # 【核心修复，必须保留】直接删除包含 "src/filesystem.c" 的那一行
          sed -i '/src\/filesystem.c/d' ${RCUTILS_CMAKE_FILE}

          echo "🔍 Verifying patch..."
          if ! grep -q 'src/filesystem.c' "${RCUTILS_CMAKE_FILE}"; then
            echo "✅ Patch successfully applied. 'src/filesystem.c' has been removed from the source list."
          else
            echo "❌ CRITICAL: Failed to patch ${RCUTILS_CMAKE_FILE}. Aborting."
            exit 1
          fi
          
          # 【v27 修正】恢复使用 colcon.meta 文件来传递分包参数
          META_FILE_PATH="${PWD}/colcon.meta"
          echo "ℹ️ Creating colcon meta file for package-specific configuration: ${META_FILE_PATH}"
          echo '{
              "packages": {
                  "rcutils": {
                      "cmake-args": [
                          "-DRCUTILS_USE_CUSTOM_CLOCK=ON",
                          "-DRCUTILS_NO_FILESYSTEM=ON"
                      ]
                  },
                  "rmw_microxrcedds": {
                      "cmake-args": [
                          "-DRMW_UXRCE_TRANSPORT=custom",
                          "-DUCLIENT_PROFILE_UDP=OFF",
                          "-DUCLIENT_PROFILE_TCP=OFF"
                      ]
                  }
              }
          }' > ${META_FILE_PATH}

          echo "🚀 Starting the definitive build process..."
          # 【v27 修正】使用简洁的 colcon build 命令，所有分包参数由 colcon.meta 管理
          colcon build \
            --merge-install \
            --cmake-args \
              -DBUILD_TESTING=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN_PATH}
          
          cd ../.. 
          echo "::endgroup::"

          echo "::group::4. Package the artifacts"
          LIB_PATH=$(find firmware/mcu_ws/build -name "libmicroros.a" | head -n 1)
          if [ -z "$LIB_PATH" ]; then
            echo "❌ FATAL: libmicroros.a was NOT found after build."
            exit 1
          else
            echo "✅ SUCCESS! Found library at: $LIB_PATH"
            cd ..
            mkdir -p export/lib
            mkdir -p export/include
            cp microros_ws/$LIB_PATH export/lib/
            cp -r microros_ws/firmware/mcu_ws/install/include/* export/include/
            echo "✅ Artifacts for Cortex-M4 Hard-Float build are ready for upload."
          fi
          echo "::endgroup::"

      - name: Upload Cortex-M4 Hard-Float Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros-cortex-m4-hard-float
          path: export/
