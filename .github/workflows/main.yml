# 文件名: .github/workflows/build-microros.yml
# 描述: v43 (逻辑短路版 - 物理隔绝)
#
# 1. 故障复盘: 即使在 CMakeLists.txt 头部强制设置了 FORCE 变量，构建系统
#    似乎依然顽固地编译 UDP 代码。可能是 configure_file 机制或后续逻辑覆盖导致。
# 2. 终极策略: 不再纠结于变量的值。直接修改 CMakeLists.txt 中的逻辑判断语句。
#    将 "if(UCLIENT_PROFILE_UDP)" 替换为 "if(OFF)"。
#    这样无论变量是什么，相关源文件都绝对不会被加入编译列表。
# 3. 结果: 彻底物理隔绝 Linux 传输层代码。

name: Build micro-ROS for Cortex-M4 Hard-Float

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake python3-pip gcc-arm-none-eabi

      - name: Install Python Dependencies
        run: |
          pip3 install -U colcon-common-extensions vcstool

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Create, Build and Package micro-ROS
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash

          echo "::group::1. Prepare and build the micro_ros_setup tool"
          mkdir -p microros_ws
          cd microros_ws
          git clone -b humble https://github.com/micro-ROS/micro_ros_setup.git src/micro_ros_setup
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then sudo rosdep init; fi
          rosdep update
          colcon build --packages-select micro_ros_setup
          echo "::endgroup::"
          
          echo "::group::2. Download firmware sources and install their dependencies"
          source install/setup.bash
          ros2 run micro_ros_setup create_firmware_ws.sh generate_lib
          rosdep install --from-paths src --ignore-src -y --skip-keys="micro_ros_msgs" || echo "rosdep install failed but continuing build..."
          echo "::endgroup::"
          
          echo "::group::3. Configure and Build Firmware with Precise Settings"
          TOOLCHAIN_PATH="${PWD}/firmware/stm32_hardfloat.cmake" 
          echo "DIAGNOSTIC: Creating toolchain file at: ${TOOLCHAIN_PATH}"
          
          echo '# Set the target system for ARM Cortex-M4 with Hard FPU
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)
          set(TARGET_FLAGS "-mthumb -mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16 --specs=nosys.specs")
          set(CMAKE_C_FLAGS           "${TARGET_FLAGS} -Wall -Wextra" CACHE INTERNAL "")
          set(CMAKE_CXX_FLAGS         "${TARGET_FLAGS} -Wall -Wextra -fno-exceptions" CACHE INTERNAL "")
          set(CMAKE_ASM_FLAGS         "${TARGET_FLAGS}" CACHE INTERNAL "")
          set(CMAKE_EXE_LINKER_FLAGS  "-Wl,--gc-sections" CACHE INTERNAL "")
          ' > ${TOOLCHAIN_PATH}
          
          cd firmware/mcu_ws
          echo "DIAGNOSTIC: Changed directory to $(pwd)"

          # ====================================================================
          # PHASE 1: rcutils 修复 (保持不变)
          # ====================================================================
          RCUTILS_CMAKE_FILE="uros/rcutils/CMakeLists.txt"
          echo "DIAGNOSTIC: Applying rcutils SURGICAL PATCHES..."
          sed -i '/src\/filesystem.c/d' ${RCUTILS_CMAKE_FILE}
          sed -i '/src\/shared_library.c/d' ${RCUTILS_CMAKE_FILE}
          sed -i '/src\/time_unix.c/d' ${RCUTILS_CMAKE_FILE}
          sed -i '/src\/process.c/d' ${RCUTILS_CMAKE_FILE}
          sed -i '/src\/env.c/d' ${RCUTILS_CMAKE_FILE}

          # ====================================================================
          # PHASE 2: microxrcedds_client 终极修复 (逻辑短路)
          # ====================================================================
          XRCE_CLIENT_PATH="eProsima/Micro-XRCE-DDS-Client"
          XRCE_CMAKE_FILE="${XRCE_CLIENT_PATH}/CMakeLists.txt"
          
          echo "DIAGNOSTIC: Short-circuiting logic in ${XRCE_CMAKE_FILE}..."
          
          # 1. 将 if(UCLIENT_PROFILE_UDP) 替换为 if(OFF)
          sed -i 's/if(UCLIENT_PROFILE_UDP)/if(OFF)/g' ${XRCE_CMAKE_FILE}
          sed -i 's/if(UCLIENT_PROFILE_TCP)/if(OFF)/g' ${XRCE_CMAKE_FILE}
          sed -i 's/if(UCLIENT_PROFILE_SERIAL)/if(OFF)/g' ${XRCE_CMAKE_FILE}
          
          # 2. 强制开启 Custom Transport
          # 找到 if(UCLIENT_PROFILE_CUSTOM_TRANSPORT) 并替换为 if(ON)
          sed -i 's/if(UCLIENT_PROFILE_CUSTOM_TRANSPORT)/if(ON)/g' ${XRCE_CMAKE_FILE}

          # 3. 验证修改
          echo "DIAGNOSTIC: Verifying Logic Short-circuit:"
          grep "if(OFF)" ${XRCE_CMAKE_FILE} || echo "WARNING: Short-circuit failed?"

          # 4. 处理 time.c
          XRCE_TIME_FILE="${XRCE_CLIENT_PATH}/src/c/util/time.c"
          echo "DIAGNOSTIC: Neutralizing ${XRCE_TIME_FILE}..."
          echo "/* Content removed. User must implement uxr_millis */" > ${XRCE_TIME_FILE}
          echo "typedef int dummy_symbol_to_avoid_empty_translation_unit_warning;" >> ${XRCE_TIME_FILE}

          # ====================================================================
          # PHASE 3: 缓存深度清理
          # ====================================================================
          echo "DIAGNOSTIC: 🔥 Performing DEEP CLEAN..."
          rm -rf build/ install/ log/
          find . -name "CMakeCache.txt" -print -delete
          find . -name "CMakeFiles" -type d -exec rm -rf {} + 2>/dev/null || true
          
          echo "DIAGNOSTIC: Clean complete. Starting fresh build..."

          # ====================================================================
          # PHASE 4: 构建
          # ====================================================================
          
          colcon build \
            --merge-install \
            --cmake-args \
              -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN_PATH} \
              -DBUILD_TESTING=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DRCUTILS_USE_CUSTOM_CLOCK=ON \
              -DRCUTILS_NO_FILESYSTEM=ON \
              -DUCLIENT_CUSTOM_TRANSPORT_MTU=512 \
              -DRMW_UXRCE_TRANSPORT=custom \
              --no-warn-unused-cli
          
          cd ../.. 
          echo "::endgroup::"

          # ====================================================================
          # PHASE 5: 产物验证
          # ====================================================================
          echo "::group::5. Verify and Package Artifacts"
          LIB_PATH=$(find firmware/mcu_ws/build -name "libmicroros.a" | head -n 1)
          
          if [ -z "$LIB_PATH" ]; then
            echo "DIAGNOSTIC: ❌ FATAL: libmicroros.a was NOT found."
            exit 1
          else
            echo "DIAGNOSTIC: ✅ SUCCESS! Found library at: $LIB_PATH"
            
            echo "DIAGNOSTIC: 🔍 Inspecting Library Symbols..."
            
            if arm-none-eabi-nm "$LIB_PATH" | grep -q "udp_transport"; then
                echo "  [FAIL] UDP symbols STILL found! Short-circuit failed."
                exit 1
            else
                echo "  [OK] UDP symbols GONE. Logic Short-circuit success."
            fi
            
            if arm-none-eabi-nm "$LIB_PATH" | grep -q "T uxr_init_session"; then
                echo "  [OK] uxr_init_session found."
            fi
            
            if arm-none-eabi-nm "$LIB_PATH" | grep -q "U uxr_millis"; then
                echo "  [OK] uxr_millis is Undefined (Correct behavior)."
            fi

            cd ..
            mkdir -p export/lib
            mkdir -p export/include
            cp microros_ws/$LIB_PATH export/lib/
            cp -r microros_ws/firmware/mcu_ws/install/include/* export/include/
            echo "DIAGNOSTIC: Artifacts are verified and ready."
          fi
          echo "::endgroup::"

      - name: Upload Cortex-M4 Hard-Float Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros-cortex-m4-hard-float
          path: export/
