name: Build micro-ROS Static Library (F405 Hard-Float)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. [关键修改] 检出官方仓库的代码，而不是你的 Fork
      # 这样保证一定有 humble 分支和构建脚本
      - name: Checkout Official Repository
        uses: actions/checkout@v4
        with:
          repository: micro-ROS/micro_ros_stm32cubemx_utils
          ref: humble

      # 2. 运行 Docker 编译
      # 注意：我们将当前下载下来的代码挂载进 Docker
      # Docker 会读取其中的 library_generation.sh 脚本开始工作
      - name: Build libmicroros.a using Docker
        run: |
          # 赋予脚本执行权限 (防止 permission denied)
          chmod -R +x microros_static_library_ide/library_generation

          # 运行 Docker
          # 这里的 $(pwd) 指向刚刚下载的官方代码目录
          docker run --rm -v $(pwd)/microros_static_library_ide:/project/microros_static_library microros/micro_ros_static_library_builder:humble -d -t cortex_m4 -f hard -p host

          # 修复生成文件的权限 (方便后续上传)
          sudo chown -R $USER:$USER microros_static_library_ide

      # 3. [调试] 检查文件是否生成
      - name: Check Generated Files
        run: |
          ls -l microros_static_library_ide/lib/microros/

      # 4. 上传产物
      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros_hard_float
          path: |
            microros_static_library_ide/lib/microros/libmicroros.a
            microros_static_library_ide/lib/microros/include/
