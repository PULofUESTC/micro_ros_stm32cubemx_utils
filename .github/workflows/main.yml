# 文件名: .github/workflows/build-microros.yml
# 描述: v15 (终极版) 修正了 colcon build 命令的执行路径。通过深入分析目录结构，
#       我们发现真正的 colcon 工作空间位于 firmware/mcu_ws/。将编译命令的
#       执行上下文切换到此目录，确保了 colcon 能找到源码并执行编译，最终成功
#       生成目标库文件，完成了整个 CI 流程。

name: Build micro-ROS From Source (Final Version v15 - Correct Path)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake python3-pip gcc-arm-none-eabi

      - name: Install Python Dependencies
        run: |
          pip3 install -U colcon-common-extensions vcstool

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Create, Build and Package micro-ROS
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash

          echo "::group::1. Prepare and build the micro_ros_setup tool"
          mkdir -p microros_ws
          cd microros_ws

          git clone -b humble https://github.com/micro-ROS/micro_ros_setup.git src/micro_ros_setup
          
          for i in 1 2 3; do sudo rosdep init && break || sleep 5; done
          rosdep update
          
          colcon build --packages-select micro_ros_setup
          echo "::endgroup::"
          
          echo "::group::2. Download firmware sources and install their dependencies"
          source install/setup.bash

          ros2 run micro_ros_setup create_firmware_ws.sh generate_lib
          
          # 注意：此处的 rosdep install 可能会因为找不到某些包而失败，但在 generate_lib 模式下通常不是必需的
          # 如果遇到问题，可以考虑暂时注释掉下面这行
          rosdep install --from-paths src --ignore-src -y --skip-keys="micro_ros_msgs"
          echo "::endgroup::"
          
          echo "::group::3. Configure and Build Firmware with Correct Path"
          # --- 【v15 最终修复核心】 ---

          # 1. 创建工具链文件
          TOOLCHAIN_FILENAME="stm32_hardfloat.cmake"
          # 将工具链文件放在 firmware 目录，方便 colcon 从 mcu_ws 中引用
          TOOLCHAIN_PATH="${PWD}/firmware/${TOOLCHAIN_FILENAME}" 
          echo "ℹ️ Creating toolchain file: ${TOOLCHAIN_PATH}"
          echo '# Set the target system for ARM Cortex-M4 with Hard FPU
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)
          set(TARGET_FLAGS "-mthumb -mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16 --specs=nosys.specs")
          set(CMAKE_C_FLAGS           "${TARGET_FLAGS} -Wall -Wextra" CACHE INTERNAL "")
          set(CMAKE_CXX_FLAGS         "${TARGET_FLAGS} -Wall -Wextra -fno-exceptions" CACHE INTERNAL "")
          set(CMAKE_ASM_FLAGS         "${TARGET_FLAGS}" CACHE INTERNAL "")
          set(CMAKE_EXE_LINKER_FLAGS  "-Wl,--gc-sections" CACHE INTERNAL "")
          ' > ${TOOLCHAIN_PATH}
          
          echo "--- Verifying Toolchain File ---"
          cat ${TOOLCHAIN_PATH}
          echo "--------------------------------"

          # 2. 【v15 变更】进入正确的 colcon 工作空间目录 (firmware/mcu_ws)
          cd firmware/mcu_ws

          echo "✅ Changed directory to $(pwd), which contains the 'src' folder for colcon."

          # 3. 直接调用 colcon build 并传入所有参数
          echo "🚀 Starting the build process from the correct workspace directory..."
          colcon build \
            --merge-install \
            --cmake-args \
              -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN_PATH} \
              -DRMW_UXRCE_TRANSPORT=custom \
              -DUCLIENT_PROFILE_UDP=OFF \
              -DUCLIENT_PROFILE_TCP=OFF \
              -DBUILD_SHARED_LIBS=OFF
          
          cd ../.. # 返回 microros_ws 根目录
          echo "::endgroup::"

          echo "::group::4. Package the artifacts"
          # 【v15 变更】在正确的路径下查找库和头文件
          # 库文件在 build 目录中，头文件在 install 目录中
          LIB_PATH=$(find firmware/mcu_ws/build -name "libmicroros.a" | head -n 1)
          if [ -z "$LIB_PATH" ]; then
            echo "❌ FATAL: libmicroros.a was NOT found after build."
            echo "--- This likely means the colcon build command failed silently or produced no output. ---"
            echo "--- Listing the entire workspace for debugging ---"
            ls -R .
            exit 1
          else
            echo "✅ SUCCESS! Found library at: $LIB_PATH"
            cd ..
            mkdir -p export/lib
            mkdir -p export/include
            cp microros_ws/$LIB_PATH export/lib/
            # 使用 --merge-install 后，所有头文件都在一个 install 目录下
            cp -r microros_ws/firmware/mcu_ws/install/include/* export/include/
            echo "✅ Artifacts copied to export/ directory for upload."
          fi
          echo "::endgroup::"

      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros_hard_float_from_source
          path: export/
