# 文件名: .github/workflows/build-microros.yml
# 描述: 一个使用官方脚本从源码编译 micro-ROS 静态库的 GitHub Actions 工作流。
# 这个版本是最稳定和推荐的版本，因为它利用了 micro-ROS 自己的工具来处理复杂的依赖和编译步骤。

name: Build micro-ROS From Source (Official Script Method)

on: 
  # 允许在 GitHub Actions 页面手动触发此工作流
  workflow_dispatch:

jobs:
  build:
    # 在最新的 Ubuntu 虚拟机环境中运行
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 安装编译所需的核心依赖
      # 包括 git, cmake, python, pip, vcstool 和 ARM 交叉编译工具链
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake python3-pip gcc-arm-none-eabi
          pip3 install -U colcon-common-extensions vcstool

      # 步骤 2: 缓存 micro-ROS 的源码目录
      # 如果源码已下载，后续运行会直接使用缓存，大大加快流程
      - name: Cache micro-ROS source code
        id: cache-microros-src
        uses: actions/cache@v4
        with:
          path: microros_ws/src
          key: ${{ runner.os }}-microros-src-humble

      # 步骤 3: 使用官方脚本创建、编译并打包 micro-ROS
      # 这是核心步骤，将所有相关操作放在一个脚本中执行，以保证环境的一致性。
      - name: Create, Build and Package micro-ROS using official scripts
        run: |
          # --- 第 1 部分：准备源码 ---
          echo "::group::Preparing micro-ROS source code"
          # 创建工作区并进入该目录
          mkdir -p microros_ws
          cd microros_ws
          
          # 仅在缓存未命中（即 src 目录不存在）时，才下载 setup 工具仓库
          if [ ! -d "src" ]; then
            echo "Cache miss. Cloning setup repository..."
            # 注意：这里只克隆 setup 工具仓库，后续的源码由脚本自动拉取
            git clone -b humble https://github.com/micro-ROS/micro_ros_setup.git src/micro_ros_setup
          else
            echo "Cache hit. Skipping setup repository clone."
          fi
          echo "::endgroup::"

          # --- 第 2 部分：创建固件工作区并编译 ---
          echo "::group::Create firmware workspace and build"
          # 激活 ROS 2 (humble) 的环境，这是运行后续 ROS 2 命令所必需的
          source /opt/ros/humble/setup.bash
          
          # 创建一个 CMake 工具链文件，用于指定交叉编译参数
          echo '# Set the target system
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          # Specify the cross-compiler
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)
          # Define the EXACT compiler flags for Cortex-M4 with hard-float
          set(TARGET_FLAGS "-mthumb -mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16")
          set(CMAKE_C_FLAGS           "${TARGET_FLAGS} -Wall -Wextra" CACHE INTERNAL "")
          set(CMAKE_CXX_FLAGS         "${TARGET_FLAGS} -Wall -Wextra -fno-exceptions" CACHE INTERNAL "")
          set(CMAKE_ASM_FLAGS         "${TARGET_FLAGS}" CACHE INTERNAL "")
          set(CMAKE_EXE_LINKER_FLAGS  "-Wl,--gc-sections" CACHE INTERNAL "")
          ' > toolchain.cmake
          
          # 执行官方脚本来创建和编译工作区
          # 这个脚本会自动处理 vcs import 拉取所有源码和 colcon build 编译
          ros2 run micro_ros_setup create_firmware_ws.sh generate_lib --toolchain-file $(pwd)/toolchain.cmake
          echo "::endgroup::"

          # --- 第 3 部分：打包产物 ---
          # 官方脚本已经完成了编译，产物会放在一个名为 'firmware' 的子目录中
          echo "::group::Packaging artifacts"
          echo "Searching for the static library libmicroros.a..."
          LIB_PATH=$(find firmware/build/libmicroros.a | head -n 1)
          if [ -z "$LIB_PATH" ]; then
            echo "❌ Error: libmicroros.a was NOT found after build. Build failed."
            echo "Listing the entire workspace for debugging:"
            ls -R .
            exit 1
          else
            echo "✅ Found library at: $LIB_PATH"
            # 返回到工作流的根目录，以创建用于上传的 export 文件夹
            cd .. 
            mkdir -p export/lib
            mkdir -p export/include
            # 复制库文件和所有头文件到 export 目录
            cp microros_ws/$LIB_PATH export/lib/
            cp -r microros_ws/firmware/build/include/* export/include/
            echo "✅ Copied artifacts to export/ directory for upload."
          fi
          echo "::endgroup::"

      # 步骤 4: 上传编译产物
      # 将包含库文件和头文件的 export 目录打包成一个 artifact，以便在工作流结束后下载
      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros_hard_float_from_source
          path: export/
