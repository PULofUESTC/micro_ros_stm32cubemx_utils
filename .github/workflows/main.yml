# 文件名: .github/workflows/build-microros.yml
name: Build micro-ROS From Source (Optimized for GitHub Actions)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 安装核心依赖 (使用默认官方源，速度最快)
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake python3-pip gcc-arm-none-eabi
          pip3 install -U colcon-common-extensions vcstool

      # 【核心优化】缓存 micro-ROS 的源码，避免重复下载
      - name: Cache micro-ROS source code
        id: cache-microros-src
        uses: actions/cache@v4
        with:
          path: microros_ws/src
          key: ${{ runner.os }}-microros-src-humble

      # 2. 准备工作区并获取所有 micro-ROS 源码 (仅在没有缓存时运行)
      - name: Get micro-ROS Source Code
        if: steps.cache-microros-src.outputs.cache-hit != 'true'
        run: |
          mkdir -p microros_ws/src
          cd microros_ws
          git clone -b humble https://github.com/micro-ROS/micro_ros_setup.git src/micro_ros_setup
          vcs import src < src/micro_ros_setup/micro_ros_setup/sources/humble.repos

      # 3. 创建工具链文件并开始编译
      - name: Build micro-ROS Static Library
        run: |
          cd microros_ws
          
          # 创建 CMake 工具链文件
          echo '# Set the target system
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          # Specify the cross-compiler
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)
          # Define the EXACT compiler flags for Cortex-M4 with hard-float
          set(TARGET_FLAGS "-mthumb -mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16")
          set(CMAKE_C_FLAGS           "${TARGET_FLAGS} -Wall -Wextra" CACHE INTERNAL "")
          set(CMAKE_CXX_FLAGS         "${TARGET_FLAGS} -Wall -Wextra -fno-exceptions" CACHE INTERNAL "")
          set(CMAKE_ASM_FLAGS         "${TARGET_FLAGS}" CACHE INTERNAL "")
          set(CMAKE_EXE_LINKER_FLAGS  "-Wl,--gc-sections" CACHE INTERNAL "")
          ' > toolchain.cmake

          # 激活 ROS 2 环境 (GitHub Actions 的 ubuntu-latest 镜像预装了 ROS2 Humble)
          source /opt/ros/humble/setup.bash

          # 使用 colcon 和工具链进行编译
          colcon build \
            --merge-install \
            --packages-up-to micro_ros_static_library_builder \
            --cmake-args "-DCMAKE_TOOLCHAIN_FILE=$(pwd)/toolchain.cmake"

      # 4. 查找并移动产物
      - name: Find and Move Artifacts
        run: |
          echo "Searching for libmicroros.a..."
          LIB_PATH=$(find microros_ws/install/lib -name "libmicroros.a" | head -n 1)
          if [ -z "$LIB_PATH" ]; then
            echo "❌ Error: libmicroros.a was NOT found. Build failed."
            ls -R microros_ws
            exit 1
          else
            echo "✅ Found library at: $LIB_PATH"
            mkdir -p export/lib
            mkdir -p export/include
            cp "$LIB_PATH" export/lib/
            cp -r microros_ws/install/include/* export/include/
            echo "✅ Copied include files from microros_ws/install/include/"
          fi
          
      # 5. 上传产物
      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros_hard_float_from_source
          path: export/
