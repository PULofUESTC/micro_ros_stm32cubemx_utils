# 文件名: .github/workflows/build-microros.yml
# 描述: v11 修复交叉编译链接错误。通过在工具链文件中添加 `--specs=nosys.specs` 标志，
#       为裸机系统提供了 C 库所需的底层系统调用存根 (syscall stubs)，
#       解决了 `undefined reference to \`_exit'\`` 的问题。

name: Build micro-ROS From Source (Final Fix v11 - Syscall Stubs)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake python3-pip gcc-arm-none-eabi

      - name: Install Python Dependencies
        run: |
          pip3 install -U colcon-common-extensions vcstool

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Create, Build and Package micro-ROS
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash

          echo "::group::1. Prepare and build the micro_ros_setup tool"
          mkdir -p microros_ws
          cd microros_ws

          git clone -b humble https://github.com/micro-ROS/micro_ros_setup.git src/micro_ros_setup
          
          # Retry rosdep init to handle potential network flakes
          for i in 1 2 3; do sudo rosdep init && break || sleep 5; done
          rosdep update
          
          colcon build --packages-select micro_ros_setup
          echo "::endgroup::"
          
          echo "::group::2. Download firmware sources and install their dependencies"
          source install/setup.bash

          ros2 run micro_ros_setup create_firmware_ws.sh generate_lib
          
          rosdep install --from-paths src --ignore-src -y
          echo "::endgroup::"
          
          echo "::group::3. Create Toolchain and Build with Correct Arguments"
          # --- 【v11 交叉编译链接修复核心】 ---

          TOOLCHAIN_FILENAME="stm32_hardfloat.cmake"
          TOOLCHAIN_PATH="${PWD}/${TOOLCHAIN_FILENAME}"
          echo "ℹ️ Creating toolchain file at absolute path: ${TOOLCHAIN_PATH}"

          # 2. 创建工具链文件。
          #    【v11 变更】: 在 TARGET_FLAGS 中添加了 --specs=nosys.specs
          echo '# Set the target system for ARM Cortex-M4 with Hard FPU
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)
          
          # Define target-specific flags, including the crucial spec for syscall stubs
          set(TARGET_FLAGS "-mthumb -mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16 --specs=nosys.specs")
          
          set(CMAKE_C_FLAGS           "${TARGET_FLAGS} -Wall -Wextra" CACHE INTERNAL "")
          set(CMAKE_CXX_FLAGS         "${TARGET_FLAGS} -Wall -Wextra -fno-exceptions" CACHE INTERNAL "")
          set(CMAKE_ASM_FLAGS         "${TARGET_FLAGS}" CACHE INTERNAL "")
          set(CMAKE_EXE_LINKER_FLAGS  "-Wl,--gc-sections" CACHE INTERNAL "")
          ' > ${TOOLCHAIN_PATH}

          echo "--- Verifying Toolchain File ---"
          ls -l ${TOOLCHAIN_PATH}
          cat ${TOOLCHAIN_PATH}
          echo "------------------------------"
          
          echo "🚀 Starting the build process, passing the toolchain file path directly..."
          ros2 run micro_ros_setup build_firmware.sh ${TOOLCHAIN_PATH} libmicroros.cmake
          echo "::endgroup::"

          echo "::group::4. Package the artifacts"
          LIB_PATH=$(find firmware/build -name "libmicroros.a" | head -n 1)
          if [ -z "$LIB_PATH" ]; then
            echo "❌ FATAL: libmicroros.a was NOT found after build."
            echo "--- Searching for CMakeError.log for post-mortem analysis ---"
            find firmware/build -name "CMakeError.log" -exec echo "Found log at: {}" \; -exec cat {} \;
            echo "--- Listing the entire workspace for debugging ---"
            ls -R .
            exit 1
          else
            echo "✅ Success! Found library at: $LIB_PATH"
            cd ..
            mkdir -p export/lib
            mkdir -p export/include
            cp microros_ws/$LIB_PATH export/lib/
            cp -r microros_ws/firmware/build/include/* export/include/
            echo "✅ Artifacts copied to export/ directory for upload."
          fi
          echo "::endgroup::"

      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros_hard_float_from_source
          path: export/
