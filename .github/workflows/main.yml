name: Build micro-ROS Static Library (F405 Hard-Float)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Official Repository
        uses: actions/checkout@v4
        with:
          repository: micro-ROS/micro_ros_stm32cubemx_utils
          ref: humble

      - name: Build libmicroros.a using Docker
        run: |
          mkdir -p microros_static_library_ide/lib/microros
          chmod -R 777 microros_static_library_ide
          
          # 运行 Docker
          sudo docker run --rm -v $(pwd)/microros_static_library_ide:/project/microros_static_library \
            microros/micro_ros_static_library_builder:humble \
            -d -t cortex_m4 -f hard -p host
          
          # 修复权限
          sudo chown -R $runner:docker microros_static_library_ide || true
          sudo chmod -R 777 microros_static_library_ide

      # [修正版] 智能查找与归位
      - name: Find and Move Artifacts
        run: |
          echo "=== Locating Artifacts ==="
          
          # 1. 查找库文件 (不论它藏在哪)
          LIB_SRC=$(find . -name "libmicroros.a" | head -n 1)
          echo "Found lib at: $LIB_SRC"
          
          # 2. 查找 include 文件夹 (通常在库文件旁边)
          # 我们查找包含 rcl/rcl.h 的 include 目录，确保找对地方
          INC_SRC=$(find . -type f -name "rcl.h" | grep "/include/rcl/rcl.h" | head -n 1 | sed 's|/rcl/rcl.h||')
          echo "Found include at: $INC_SRC"
          
          if [ -z "$LIB_SRC" ]; then
            echo "❌ ERROR: libmicroros.a compilation failed!"
            exit 1
          fi
          
          # 3. 搬运到标准出口
          mkdir -p export/lib
          mkdir -p export/include
          
          cp "$LIB_SRC" export/lib/
          cp -r "$INC_SRC"/* export/include/
          
          echo "✅ Artifacts moved to export/"
          ls -R export/

      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros_hard_float
          path: export/
