# 文件名: .github/workflows/build-microros.yml
# 描述: v9 健壮性增强版。解决了 v8 中因 `grep` 未找到匹配项而导致工作流失败的问题。
#       1. 增加了更详细的日志，在修改前后都打印脚本内容。
#       2. 使用 'if grep -q' 结构进行更安全的验证，避免因 `set -e` 导致意外中止。

name: Build micro-ROS From Source (Final Fix v9 - Robust Verification)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake python3-pip gcc-arm-none-eabi
          pip3 install -U colcon-common-extensions vcstool

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Create, Build and Package micro-ROS
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash

          echo "::group::1. Prepare and build the micro_ros_setup tool"
          mkdir -p microros_ws
          cd microros_ws

          git clone -b humble https://github.com/micro-ROS/micro_ros_setup.git src/micro_ros_setup
          
          for i in 1 2 3; do sudo rosdep init && break || sleep 5; done
          rosdep update
          
          colcon build --packages-select micro_ros_setup
          echo "::endgroup::"
          
          echo "::group::2. Download firmware sources and install their dependencies"
          source install/setup.bash

          ros2 run micro_ros_setup create_firmware_ws.sh generate_lib
          
          rosdep install --from-paths src --ignore-src -y
          echo "::endgroup::"
          
          echo "::group::3. Modify script, Set Environment, and Build"
          # --- 【v9 健壮性增强核心】 ---

          # 1. 定义工具链文件的绝对路径
          TOOLCHAIN_PATH="${PWD}/stm32_hardfloat.cmake"
          echo "ℹ️ Toolchain file absolute path is set to: ${TOOLCHAIN_PATH}"

          # 2. 创建工具链文件
          echo '# Set the target system for ARM Cortex-M4 with Hard FPU
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)
          set(TARGET_FLAGS "-mthumb -mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16")
          set(CMAKE_C_FLAGS           "${TARGET_FLAGS} -Wall -Wextra" CACHE INTERNAL "")
          set(CMAKE_CXX_FLAGS         "${TARGET_FLAGS} -Wall -Wextra -fno-exceptions" CACHE INTERNAL "")
          set(CMAKE_ASM_FLAGS         "${TARGET_FLAGS}" CACHE INTERNAL "")
          set(CMAKE_EXE_LINKER_FLAGS  "-Wl,--gc-sections" CACHE INTERNAL "")
          ' > ${TOOLCHAIN_PATH}
          
          # 3. 设置 COLCON_CMAKE_ARGS 环境变量
          export COLCON_CMAKE_ARGS="--no-warn-unused-cli -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN_PATH}"
          echo "✅ COLCON_CMAKE_ARGS has been set to: '${COLCON_CMAKE_ARGS}'"

          # 4. 定义要修改的、位于 *安装目录* 的脚本的正确路径
          BUILD_SCRIPT_PATH="install/micro_ros_setup/lib/micro_ros_setup/build_firmware.sh"
          echo " targeting the *installed* script at: ${BUILD_SCRIPT_PATH}"

          # 5. [诊断] 在修改前，打印脚本中 colcon build 命令附近的上下文
          echo "--- Script content BEFORE modification ---"
          grep -C 5 "colcon build" ${BUILD_SCRIPT_PATH}
          echo "----------------------------------------"

          # 6. [外科手术] 对 build_firmware.sh 脚本进行在線修改
          sed -i 's|-DCMAKE_TOOLCHAIN_FILE=\${TOOLCHAIN_FILE_NAME}||g' ${BUILD_SCRIPT_PATH}

          # 7. [诊断] 在修改后，再次打印脚本内容以供对比
          echo "--- Script content AFTER modification ---"
          # 使用 '|| true' 来确保即使 grep 找不到匹配项，脚本也不会因此失败
          grep -C 5 "colcon build" ${BUILD_SCRIPT_PATH} || true
          echo "---------------------------------------"
          
          # 8. [健壮验证] 使用不会导致脚本失败的方式来验证修改是否成功
          echo "--- Verifying script modification (Robust Check) ---"
          if grep -q "CMAKE_TOOLCHAIN_FILE" ${BUILD_SCRIPT_PATH}; then
            echo "❌ ERROR: The toolchain argument was NOT removed from the script."
            exit 1
          else
            echo "✅ SUCCESS: The toolchain argument was successfully removed."
          fi
          echo "----------------------------------------------------"

          # 9. 执行被我们修改过的脚本
          echo "🚀 Starting the build process with the modified script..."
          ros2 run micro_ros_setup build_firmware.sh stm32_hardfloat libmicroros.cmake
          echo "::endgroup::"

          echo "::group::4. Package the artifacts"
          LIB_PATH=$(find firmware/build -name "libmicroros.a" | head -n 1)
          if [ -z "$LIB_PATH" ]; then
            echo "❌ FATAL: libmicroros.a was NOT found after build."
            echo "--- Searching for CMakeError.log for post-mortem analysis ---"
            find firmware/build -name "CMakeError.log" -exec echo "Found log at: {}" \; -exec cat {} \;
            echo "--- Listing the entire workspace for debugging ---"
            ls -R .
            exit 1
          else
            echo "✅ Success! Found library at: $LIB_PATH"
            cd ..
            mkdir -p export/lib
            mkdir -p export/include
            cp microros_ws/$LIB_PATH export/lib/
            cp -r microros_ws/firmware/build/include/* export/include/
            echo "✅ Artifacts copied to export/ directory for upload."
          fi
          echo "::endgroup::"

      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros_hard_float_from_source
          path: export/
