# 文件名: .github/workflows/build-microros.yml
# 描述: 最终完美版 v2。解决了固件依赖问题，确保编译过程成功。

name: Build micro-ROS From Source (Final Perfected Version v2)

on:
  # 允许在 GitHub Actions 页面手动触发此工作流
  workflow_dispatch:

jobs:
  build:
    # 明确指定与 ROS 2 Humble 兼容的 Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      # 步骤 1: 检出你的代码库 (这是一个好习惯，即使当前用不到)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 2: 安装核心系统依赖
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake python3-pip gcc-arm-none-eabi
          pip3 install -U colcon-common-extensions vcstool

      # 步骤 3: 安装 ROS 2 Humble
      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      # 步骤 4: 创建、编译并打包 micro-ROS
      - name: Create, Build and Package micro-ROS
        shell: bash
        run: |
          # 激活基础 ROS 2 环境
          source /opt/ros/humble/setup.bash

          # --- 第 1 部分：创建工作区并下载所有源码 ---
          echo "::group::Create workspace and download all sources"
          mkdir -p microros_ws
          cd microros_ws
          
          # 下载 setup 工具
          git clone -b humble https://github.com/micro-ROS/micro_ros_setup.git src/micro_ros_setup
          
          # 使用 setup 工具下载所有 micro-ROS 固件源码到 src/ 目录
          # 这是与之前最大的不同：我们先集齐所有源码
          ros2 run micro_ros_setup create_firmware_ws.sh generate_lib
          echo "::endgroup::"
          
          # --- 第 2 部分：为所有源码安装依赖 ---
          echo "::group::Install dependencies for all sources"
          # rosdep 必须在安装任何东西之前更新
          sudo rosdep init
          rosdep update
          # 为 src/ 目录下的所有包（包括 setup 工具和固件）安装依赖
          rosdep install --from-paths src --ignore-src -y
          echo "::endgroup::"

          # --- 第 3 部分：编译固件库 ---
          echo "::group::Build firmware library"
          # 现在，所有依赖都已满足，开始编译
          ros2 run micro_ros_setup build_firmware.sh libmicroros.cmake $(pwd)/toolchain.cmake
          echo "::endgroup::"

          # --- 第 4 部分：打包产物 ---
          echo "::group::Packaging artifacts"
          # 库文件现在位于 firmware/build 目录中
          LIB_PATH=$(find firmware/build/libmicroros.a | head -n 1)
          if [ -z "$LIB_PATH" ]; then
            echo "❌ Error: libmicroros.a was NOT found after build. Build failed."
            echo "Listing the entire workspace for debugging:"
            ls -R .
            exit 1
          else
            echo "✅ Found library at: $LIB_PATH"
            cd ..
            mkdir -p export/lib
            mkdir -p export/include
            cp microros_ws/$LIB_PATH export/lib/
            cp -r microros_ws/firmware/build/include/* export/include/
            echo "✅ Copied artifacts to export/ directory for upload."
          fi
          echo "::endgroup::"

      # 步骤 5: 上传编译产物
      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros_hard_float_from_source
          path: export/
