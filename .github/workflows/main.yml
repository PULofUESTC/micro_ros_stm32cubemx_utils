# 文件名: .github/workflows/build-microros.yml
name: Build micro-ROS Static Library (F405 Hard-Float - Ultimate)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出官方仓库
      - name: Checkout Official Repository
        uses: actions/checkout@v4
        with:
          repository: micro-ROS/micro_ros_stm32cubemx_utils
          ref: humble

      # 2. 【核心配置】创建自定义平台配置文件
      # 保留这一步是为了给 CMake 阶段提供双重保障
      - name: Create Custom Platform Definition
        run: |
          mkdir -p custom_platform
           
          # 创建 colcon.meta 文件，指向要构建的源码
          echo '{
              "names": {
                  "micro_ros_common": {
                      "type": "git",
                      "url": "https://github.com/micro-ROS/micro_ros_common.git",
                      "version": "humble"
                  }
              }
          }' > custom_platform/colcon.meta

          # 创建 toolchain.cmake 文件
          echo '# Set the target system
          set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR arm)

          # Specify the cross-compiler
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_CXX_COMPILER arm-none-eabi-g++)

          # Define the EXACT compiler flags for Cortex-M4 with hard-float
          set(TARGET_FLAGS "-mthumb -mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16")
          set(CMAKE_C_FLAGS           "${TARGET_FLAGS} -Wall -Wextra" CACHE INTERNAL "")
          set(CMAKE_CXX_FLAGS         "${TARGET_FLAGS} -Wall -Wextra -fno-exceptions" CACHE INTERNAL "")
          set(CMAKE_ASM_FLAGS         "${TARGET_FLAGS}" CACHE INTERNAL "")
          set(CMAKE_EXE_LINKER_FLAGS  "-Wl,--gc-sections" CACHE INTERNAL "")
          ' > custom_platform/toolchain.cmake

      # 3. 【修复版】运行 Docker 编译
      # 核心修复：通过 -e 强制注入环境变量，解决 library_generation.sh 识别为空的问题
      - name: Build libmicroros.a with Custom Platform
        run: |
          echo "Starting Docker build with FORCE injected Environment Variables..."
          
          # 定义参数：必须与 toolchain.cmake 中的保持一致
          export TARGET_FLAGS="-mthumb -mcpu=cortex-m4 -mfloat-abi=hard -mfpu=fpv4-sp-d16"
          
          sudo docker run --rm \
            -e CFLAGS="$TARGET_FLAGS" \
            -e CXXFLAGS="$TARGET_FLAGS" \
            -v $(pwd)/microros_static_library_ide:/project/microros_static_library \
            -v $(pwd)/custom_platform:/project/custom_platform \
            microros/micro_ros_static_library_builder:humble \
            --metas /project/custom_platform/colcon.meta \
            --cmake-args "-DCMAKE_TOOLCHAIN_FILE=/project/custom_platform/toolchain.cmake"

      # 4. 查找并移动产物
      - name: Find and Move Artifacts
        run: |
          echo "Searching for libmicroros.a..."
          LIB_PATH=$(find . -name "libmicroros.a" | head -n 1)
          if [ -z "$LIB_PATH" ]; then
            echo "❌ Error: libmicroros.a was NOT found. Build failed."
            ls -R
            exit 1
          else
            echo "✅ Found library at: $LIB_PATH"
            mkdir -p export/lib
            mkdir -p export/include
            cp "$LIB_PATH" export/lib/
            INC_PATH=$(find . -type d -name "include" | grep "microros" | head -n 1)
            if [ ! -z "$INC_PATH" ]; then
                cp -r "$INC_PATH"/* export/include/
                echo "✅ Found include files at: $INC_PATH"
            fi
          fi

      # 5. 上传产物
      - name: Upload Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmicroros_hard_float_custom_platform
          path: export/
